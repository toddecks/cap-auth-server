name: Sync Azure Order Entries
on:
  schedule:
    # Daily at 5:20 AM EST / 6:20 AM EDT, before the morning reports.
    - cron: '20 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-azure-order-entries
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      # The web server has fixed outbound addresses; hosted runners do not.
      - name: Refresh through the CSP cloud server
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const token=createHash('sha256').update('csp-order-entry-sync-v1:'+process.env.SUPABASE_SERVICE_ROLE_KEY).digest('hex');
          const response=await fetch('https://cap-auth-server.onrender.com/api/internal/order-entry-sync',{
            method:'POST',headers:{'Content-Type':'application/json','x-csp-sync-key':token},
            body:JSON.stringify({sqlUser:process.env.PSDATA_SQL_USER,sqlPassword:process.env.PSDATA_SQL_PASSWORD}),
            signal:AbortSignal.timeout(600000)
          });
          const result=await response.json();
          if(!response.ok){console.error(result);process.exit(1);}
          console.log(`Refreshed ${result.rows} orders; source through ${result.sourceThrough}.`);
          JS
        env:
          PSDATA_SQL_USER: ${{ secrets.PSDATA_SQL_USER }}
          PSDATA_SQL_PASSWORD: ${{ secrets.PSDATA_SQL_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
